name: Aggiorna feed e pubblica

on:
  schedule:
    - cron: "17 4 * * *" # ogni mattina (~6:17 ora italiana d'estate, 5:17 d'inverno)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scarica gli ultimi shorts
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE || '@soplaya' }}
        run: node scripts/fetch-feed.mjs

      - name: Salva feed.json nel repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add site/feed.json
          git diff --cached --quiet || git commit -m "Aggiorna feed shorts"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
