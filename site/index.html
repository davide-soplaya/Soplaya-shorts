<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soplaya Shorts</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: rgba(255, 255, 255, 0.75);
    --like: #ff3b5c;
    --shade: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0) 40%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

  #feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }

  .slide { position: relative; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden;
    background: #111 center / cover no-repeat; }
  .slide iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  /* Livello trasparente sopra l'iframe: permette lo swipe verticale e il tap play/pausa */
  .tap { position: absolute; inset: 0; background: var(--shade); }

  .paused-icon { position: absolute; top: 50%; left: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px;
    opacity: 0; transition: opacity .15s; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .slide.paused .paused-icon { opacity: .9; }

  .actions { position: absolute; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 20px; align-items: center; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; color: var(--fg);
    font: 600 12px/1 inherit; cursor: pointer; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .action svg { width: 32px; height: 32px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .action.like.on svg { fill: var(--like); stroke: var(--like); animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.3); } }

  .info { position: absolute; left: 16px; right: 76px; bottom: calc(24px + env(safe-area-inset-bottom)); pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .info .handle { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .info .title { font-size: 14px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .empty { height: 100dvh; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }
</style>
<script src="config.js"></script>
</head>
<body>
<main id="feed" aria-label="Feed shorts"></main>

<script>
(() => {
  const cfg = window.SHORTS_CONFIG || {};
  const feedEl = document.getElementById("feed");
  const icons = {
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2 0 3.6 1.1 4.2 2.6h2C13.6 6.1 15.2 5 17.2 5c3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>',
  };

  // Stato persistente nel browser (opzionale: funziona anche se lo storage è bloccato)
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let clientId = store.get("shorts.clientId", null);
  if (!clientId) { clientId = crypto.randomUUID?.() || String(Math.random()).slice(2); store.set("shorts.clientId", clientId); }
  const likes = new Set(store.get("shorts.likes", []));
  let muted = true; // l'autoplay su mobile è consentito solo senza audio
  let current = null;

  function sendLike(videoId, liked) {
    if (!cfg.likeEndpoint) return;
    fetch(cfg.likeEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ videoId, liked, clientId, at: new Date().toISOString() }),
      keepalive: true,
    }).catch((e) => console.warn("Like non inviato", e));
  }

  // Comandi al player YouTube via postMessage (API IFrame, senza librerie)
  function cmd(slide, func, args = []) {
    const f = slide.querySelector("iframe");
    if (f && f.dataset.ready) f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args }), "*");
  }

  function mountPlayer(slide) {
    if (slide.querySelector("iframe")) return;
    const id = slide.dataset.id;
    const params = new URLSearchParams({ autoplay: 0, mute: 1, controls: 0, playsinline: 1, loop: 1, playlist: id,
      rel: 0, modestbranding: 1, enablejsapi: 1, origin: location.origin });
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${id}?${params}`;
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.title = slide.dataset.title;
    f.addEventListener("load", () => {
      f.dataset.ready = "1";
      f.contentWindow.postMessage(JSON.stringify({ event: "listening", id }), "*");
      if (slide === current) activate(slide);
    });
    slide.prepend(f);
  }

  function unmountPlayer(slide) { slide.querySelector("iframe")?.remove(); }

  function activate(slide) {
    cmd(slide, muted ? "mute" : "unMute");
    cmd(slide, "seekTo", [0, true]);
    cmd(slide, "playVideo");
    slide.classList.remove("paused");
  }

  function setCurrent(slide) {
    if (current === slide) return;
    if (current) cmd(current, "pauseVideo");
    current = slide;
    // Tiene caricati solo il video visibile e i vicini, per non appesantire il telefono
    const slides = [...feedEl.children];
    const i = slides.indexOf(slide);
    slides.forEach((s, j) => (Math.abs(j - i) <= 1 ? mountPlayer(s) : unmountPlayer(s)));
    activate(slide);
  }

  function renderMute() {
    document.querySelectorAll(".action.mute").forEach((b) => {
      b.innerHTML = (muted ? icons.soundOff : icons.soundOn) + `<span>${muted ? "Audio" : "Muto"}</span>`;
      b.setAttribute("aria-label", muted ? "Attiva audio" : "Disattiva audio");
    });
  }

  function slideFor(item, handle) {
    const s = document.createElement("section");
    s.className = "slide";
    s.dataset.id = item.id;
    s.dataset.title = item.title;
    if (item.thumbnail) s.style.backgroundImage = `url("${item.thumbnail}")`;
    s.innerHTML = `
      <div class="tap"></div>
      <div class="paused-icon">${icons.play}</div>
      <div class="actions">
        <button class="action like" aria-pressed="false">${icons.heart}<span>Mi piace</span></button>
        <a class="action open" target="_blank" rel="noopener">${icons.open}<span>YouTube</span></a>
        <button class="action mute"></button>
      </div>
      <div class="info"><div class="handle"></div><div class="title"></div></div>`;
    s.querySelector(".open").href = item.url || `https://www.youtube.com/shorts/${item.id}`;
    s.querySelector(".handle").textContent = handle;
    s.querySelector(".title").textContent = item.title;

    const likeBtn = s.querySelector(".like");
    const renderLike = () => { const on = likes.has(item.id); likeBtn.classList.toggle("on", on); likeBtn.setAttribute("aria-pressed", on); };
    const toggleLike = (force) => {
      const on = force ?? !likes.has(item.id);
      if (on === likes.has(item.id)) return;
      on ? likes.add(item.id) : likes.delete(item.id);
      store.set("shorts.likes", [...likes]);
      renderLike();
      sendLike(item.id, on);
    };
    likeBtn.addEventListener("click", () => toggleLike());
    renderLike();

    s.querySelector(".mute").addEventListener("click", () => {
      muted = !muted;
      if (current) cmd(current, muted ? "mute" : "unMute");
      renderMute();
    });

    // Tap = play/pausa, doppio tap = like (come Instagram)
    let lastTap = 0, tapTimer;
    s.querySelector(".tap").addEventListener("click", () => {
      const now = Date.now();
      if (now - lastTap < 300) { clearTimeout(tapTimer); toggleLike(true); lastTap = 0; return; }
      lastTap = now;
      tapTimer = setTimeout(() => {
        const paused = s.classList.toggle("paused");
        cmd(s, paused ? "pauseVideo" : "playVideo");
      }, 300);
    });
    return s;
  }

  function render(feed) {
    const items = feed?.items || [];
    if (!items.length) {
      feedEl.innerHTML = '<div class="empty">Nessun video disponibile al momento.</div>';
      return;
    }
    const handle = feed.channel?.handle || "";
    items.forEach((it) => feedEl.append(slideFor(it, handle)));
    renderMute();

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setCurrent(e.target); });
    }, { root: feedEl, threshold: 0.6 });
    [...feedEl.children].forEach((s) => io.observe(s));
  }

  if (window.SHORTS_FEED) render(window.SHORTS_FEED);
  else fetch(`feed.json?t=${Date.now()}`).then((r) => r.json()).then(render)
    .catch(() => { feedEl.innerHTML = '<div class="empty">Impossibile caricare il feed.</div>'; });
})();
</script>
</body>
</html>
